plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = "Henkel"
        url = "https://maven.maxhenkel.de/repository/public"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    voskRuntime {
        transitive = false
    }
}

dependencies {
    implementation "dev.overgrown.apoli:apoli:${apoli_maven_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    voskRuntime "com.alphacephei:vosk:${vosk_version}"
    voskRuntime "net.java.dev.jna:jna:5.7.0"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            apoli_version_range    : apoli_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('collectVoskRuntime', Copy) {
    from configurations.voskRuntime
    into layout.buildDirectory.dir('voskRuntime')
    rename { it.startsWith('vosk') ? 'vosk.jar' : 'jna.jar' }
}

tasks.named('processResources') {
    dependsOn 'collectVoskRuntime'
    from(layout.buildDirectory.dir('voskRuntime')) {
        into 'birdsong/runtime'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            version = project.maven_version
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}
