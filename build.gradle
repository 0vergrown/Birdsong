plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	runs {
		client {
			programArgs("--username", "Dev")
		}
	}
}

repositories {
	mavenLocal()
	maven {
		name = "Henkel"
		url = "https://maven.maxhenkel.de/repository/public"
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "dev.overgrown.apoli:apoli:${project.apoli_maven_version}"

	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

	implementation("com.alphacephei:vosk:${project.vosk_version}") {
		transitive = false
	}
	include("com.alphacephei:vosk:${project.vosk_version}") {
		transitive = false
	}

	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
			version = project.maven_version
		}
	}
}
